<div class="max-w-[1400px] mx-auto pb-10">
  <div class="mb-8">
    <h1 class="font-bold text-[28px] text-[#0F172A] mb-2">Class Schedule</h1>
    <p class="text-[#475569] text-[14px]">
      View and book classes throughout the week
    </p>
  </div>

  <!-- DATE SELECTOR -->
  <div
    class="bg-white border border-[#E8ECF4] rounded-[12px] p-4 mb-6 flex items-center justify-between"
  >
    <button
      (click)="previousDate()"
      class="px-4 h-10 border border-[#E8ECF4] rounded-[8px] font-medium text-[13px] hover:bg-[#F8F9FC]"
    >
      ← Previous
    </button>
    <input
      type="date"
      [(ngModel)]="selectedDate"
      class="h-10 px-4 border border-[#E8ECF4] rounded-[8px] font-medium"
    />
    <button
      (click)="nextDate()"
      class="px-4 h-10 border border-[#E8ECF4] rounded-[8px] font-medium text-[13px] hover:bg-[#F8F9FC]"
    >
      Next →
    </button>
  </div>

  <!-- SCHEDULE GRID -->
  <div
    class="bg-white border border-[#E8ECF4] rounded-[12px] overflow-hidden shadow-sm"
  >
    <!-- TIME COLUMN HEADER -->
    <div class="grid grid-cols-[80px_1fr] border-b border-[#E8ECF4]">
      <div class="p-4 font-bold text-[12px] text-[#94A3B8] uppercase">Time</div>
      <div class="p-4 font-bold text-[12px] text-[#94A3B8] uppercase">
        Classes
      </div>
    </div>

    <!-- HOURLY ROWS -->
    <div
      *ngFor="let hour of hours"
      class="grid grid-cols-[80px_1fr] border-b border-[#E8ECF4] min-h-[80px]"
    >
      <!-- TIME LABEL -->
      <div
        class="p-4 font-bold text-[12px] text-[#475569] border-r border-[#E8ECF4] bg-[#F8F9FC]"
      >
        {{ hour }}:00
      </div>

      <!-- CLASSES CONTAINER -->
      <div class="p-3 relative">
        <div
          *ngFor="let cls of getClassesForTime(hour)"
          [class]="
            'absolute left-3 right-3 rounded-[8px] p-3 cursor-pointer hover:shadow-md transition-all text-white text-[12px] font-bold ' +
            cls.color
          "
          [style.height.px]="getClassHeight(cls.duration)"
        >
          <div class="mb-1">{{ cls.name }}</div>
          <div class="text-[11px] opacity-90">
            {{ cls.time }} • {{ cls.duration }}min
          </div>
          <div class="text-[11px] opacity-90 mt-1">
            {{ cls.trainer }} • {{ getAvailableSeats(cls) }} seats
          </div>

          <button
            (click)="bookClass(cls)"
            class="mt-2 px-2 py-0.5 bg-white/20 hover:bg-white/30 rounded text-[10px] font-bold"
          >
            Book
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- LEGEND -->
  <div
    class="mt-6 p-4 bg-[#F8F9FC] border border-[#E8ECF4] rounded-[12px] flex gap-4 flex-wrap"
  >
    <div class="flex items-center gap-2">
      <div class="w-4 h-4 rounded bg-[#16A34A]"></div>
      <span class="text-[12px] text-[#475569]">Beginner</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-4 h-4 rounded bg-[#2563EB]"></div>
      <span class="text-[12px] text-[#475569]">Intermediate</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-4 h-4 rounded bg-[#D97706]"></div>
      <span class="text-[12px] text-[#475569]">Mixed Level</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-4 h-4 rounded bg-[#DC2626]"></div>
      <span class="text-[12px] text-[#475569]">Advanced</span>
    </div>
  </div>
</div>
