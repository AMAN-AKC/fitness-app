<div class="app-shell">
  <!-- SIDEBAR -->
  <aside class="sidebar" [class.collapsed]="!sidebarExpanded">
    <!-- Top Section -->
    <div class="sidebar-header">
      <div class="logo-box">
        <span class="logo-text">F</span>
      </div>
      <span *ngIf="sidebarExpanded" class="logo-label">FitClub</span>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      <div *ngFor="let group of navData" class="nav-group">
        <div *ngIf="sidebarExpanded && group.label" class="nav-group-label">
          {{ group.label }}
        </div>
        <ul class="nav-items">
          <li *ngFor="let item of group.items">
            <button
              class="nav-button"
              [class.active]="isRouteActive(item.route)"
              [title]="!sidebarExpanded ? item.label : ''"
              (click)="navigateTo(item)"
            >
              <span *ngIf="item.isActive" class="active-indicator"></span>
              <span class="nav-icon">{{ item.icon }}</span>
              <span *ngIf="sidebarExpanded" class="nav-label">{{
                item.label
              }}</span>
            </button>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Bottom Section -->
    <div class="sidebar-footer">
      <div class="user-card" [class.expanded]="sidebarExpanded">
        <div class="user-avatar">{{ userName.charAt(0) }}</div>
        <div *ngIf="sidebarExpanded" class="user-info">
          <div class="user-name">{{ userName }}</div>
          <div class="user-role"><span>{{ userRole }}</span></div>
        </div>
      </div>

      <div class="footer-actions" [class.expanded]="sidebarExpanded">
        <button *ngIf="sidebarExpanded" class="logout-btn" (click)="logout()">
          <span>📤</span>
          <span>Log out</span>
        </button>
        <button
          *ngIf="sidebarExpanded"
          class="toggle-btn"
          (click)="toggleSidebar()"
        >
          ◀
        </button>
        <button
          *ngIf="!sidebarExpanded"
          class="logout-btn-icon"
          title="Log out"
          (click)="logout()"
        >
          📤
        </button>
        <button
          *ngIf="!sidebarExpanded"
          class="toggle-btn"
          (click)="toggleSidebar()"
        >
          ▶
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-container">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="breadcrumb">
        <span class="breadcrumb-item">FitClub</span>
        <span class="breadcrumb-separator">›</span>
        <span class="breadcrumb-item active">{{ getCurrentPageTitle() }}</span>
      </div>

      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          placeholder="Search members, classes..."
          class="search-input"
        />
        <div class="search-shortcut">⌘K</div>
      </div>

      <div class="topbar-actions">
        <button class="notification-btn" (click)="onNotificationsClick()">
          <span class="notification-icon">🔔</span>
          <span class="notification-badge">3</span>
        </button>
        <div class="topbar-divider"></div>
        <button class="user-dropdown" (click)="onProfileClick()">
          <div class="user-avatar-small">{{ userName.charAt(0) }}</div>
          <span>{{ userName }}</span>
          <span class="dropdown-icon">▼</span>
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
