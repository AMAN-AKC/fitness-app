<div class="app-shell">
  <!-- SIDEBAR -->
  <aside class="sidebar" [class.collapsed]="!sidebarExpanded">
    <!-- Top Section -->
    <div class="sidebar-header">
      <div class="logo-box">
        <span class="logo-text">F</span>
      </div>
      <span *ngIf="sidebarExpanded" class="logo-label">FitClub</span>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      <div *ngFor="let group of navData" class="nav-group">
        <div *ngIf="sidebarExpanded && group.label" class="nav-group-label">
          {{ group.label }}
        </div>
        <ul class="nav-items">
          <li *ngFor="let item of group.items">
            <button
              class="nav-button"
              [class.active]="item.isActive"
              [title]="!sidebarExpanded ? item.label : ''"
            >
              <span *ngIf="item.isActive" class="active-indicator"></span>
              <span class="nav-icon">{{ item.icon.charAt(0) }}</span>
              <span *ngIf="sidebarExpanded" class="nav-label">{{
                item.label
              }}</span>
            </button>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Bottom Section -->
    <div class="sidebar-footer">
      <div class="user-card" [class.expanded]="sidebarExpanded">
        <div class="user-avatar">JS</div>
        <div *ngIf="sidebarExpanded" class="user-info">
          <div class="user-name">Jane Smith</div>
          <div class="user-role"><span>Admin</span></div>
        </div>
      </div>

      <div class="footer-actions" [class.expanded]="sidebarExpanded">
        <button *ngIf="sidebarExpanded" class="logout-btn">
          <span>📤</span>
          <span>Log out</span>
        </button>
        <button
          *ngIf="sidebarExpanded"
          class="toggle-btn"
          (click)="toggleSidebar()"
        >
          ◀
        </button>
        <button
          *ngIf="!sidebarExpanded"
          class="logout-btn-icon"
          title="Log out"
        >
          📤
        </button>
        <button
          *ngIf="!sidebarExpanded"
          class="toggle-btn"
          (click)="toggleSidebar()"
        >
          ▶
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-container">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="breadcrumb">
        <span class="breadcrumb-item">Dashboard</span>
        <span class="breadcrumb-separator">›</span>
        <span class="breadcrumb-item active">Members</span>
      </div>

      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          placeholder="Search members, classes..."
          class="search-input"
        />
        <div class="search-shortcut">⌘K</div>
      </div>

      <div class="topbar-actions">
        <button class="notification-btn">
          <span class="notification-icon">🔔</span>
          <span class="notification-badge">3</span>
        </button>
        <div class="topbar-divider"></div>
        <button class="user-dropdown">
          <div class="user-avatar-small">JS</div>
          <span>Jane Smith</span>
          <span class="dropdown-icon">▼</span>
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content">
      <style>
        @keyframes fadeInUp {
          from {
            opacity: 0;
            transform: translateY(8px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        .content-wrapper {
          animation: fadeInUp 220ms ease-out forwards;
        }
      </style>

      <div class="content-wrapper">
        <!-- Page Header -->
        <div class="page-header">
          <div class="page-title-section">
            <h1 class="page-title">Members</h1>
            <p class="page-subtitle">
              Manage your fitness club members and their subscriptions.
            </p>
          </div>

          <div class="page-actions">
            <button class="btn btn-secondary">
              <span class="btn-icon">📥</span>
              <span>Export</span>
            </button>
            <button class="btn btn-primary">
              <span class="btn-icon">+</span>
              <span>Add Member</span>
            </button>
          </div>
        </div>

        <!-- Metric Cards Grid -->
        <div class="cards-grid">
          <div *ngFor="let card of metricCards" class="metric-card">
            <div class="card-label">{{ card.title }}</div>
            <div class="card-value">{{ card.value }}</div>
            <div class="card-footer">
              <span class="card-badge" [ngClass]="card.badgeClass">
                {{ card.change }}
              </span>
              <span class="card-text">{{ card.prevText }}</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
