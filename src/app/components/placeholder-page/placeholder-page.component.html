<div
  class="min-h-screen bg-gradient-to-br from-[#2563EB]/10 to-[#0F172A]/5 flex items-center justify-center p-4"
>
  <div class="text-center">
    <div class="text-[96px] mb-6 animate-pulse">🔨</div>
    <h1 class="font-bold text-[32px] text-[#0F172A] mb-3">{{ title }}</h1>
    <p class="text-[16px] text-[#475569] max-w-[400px] mx-auto mb-8">
      {{ description }}
    </p>

    <div class="flex gap-3 justify-center">
      <button
        class="px-6 h-11 bg-white border border-[#E8ECF4] text-[#475569] font-bold rounded-[8px] hover:bg-[#F8F9FC]"
      >
        ← Go Back
      </button>
      <button
        class="px-6 h-11 bg-[#2563EB] text-white font-bold rounded-[8px] hover:bg-[#1D4ED8]"
      >
        Home →
      </button>
    </div>

    <div
      class="mt-12 p-6 bg-white border border-[#E8ECF4] rounded-[12px] inline-block max-w-[400px]"
    >
      <p class="text-[13px] text-[#94A3B8] font-medium mb-3">💡 Coming Soon:</p>
      <ul class="text-[12px] text-[#475569] space-y-1 text-left">
        <li>✓ New features</li>
        <li>✓ Improved performance</li>
        <li>✓ Better user experience</li>
      </ul>
    </div>
  </div>
</div>
