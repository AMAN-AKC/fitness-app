<div class="error-page-wrapper">
  <div class="error-box">
    <!-- Icon Circle -->
    <div class="error-icon-circle">
      {{ activeError?.icon }}
    </div>

    <!-- HTTP Status Badge -->
    <div class="error-code-badge">
      {{ activeErrorCode }} {{ activeError?.status }}
    </div>

    <!-- Error Title -->
    <h1 class="error-main-title">
      {{ activeError?.title }}
    </h1>

    <!-- Error Description -->
    <p class="error-main-body">
      {{ activeError?.body }}
    </p>

    <!-- Action Section -->
    <div class="error-action-row">
      <button (click)="activeError?.action()" class="btn-error-primary">
        {{ activeError?.button }}
      </button>
      
      <span *ngIf="activeErrorCode === '500' && retryCountdown > 0" class="retry-countdown-label">
        AUTO-RETRYING IN {{ retryCountdown }}S...
      </span>
    </div>
  </div>
</div>
